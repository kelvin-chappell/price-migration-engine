stacks:
- membership
regions:
- eu-west-1
deployments:

  cfn:
    type: cloud-formation
    app: price-migration-engine-lambda
    parameters:
      templatePath: cfn.yaml

  price-migration-engine-lambda:
    type: aws-lambda
    parameters:
      fileName: price-migration-engine-lambda.jar
      bucket: membership-dist
      prefixStack: false
      # Only handlers still built by the `lambda` subproject's jar belong here. Handlers migrated to their own
      # Scala 3 subproject (see docs/scala-3-migration.md) must be removed from this list: otherwise this
      # deployment (which runs after `cfn`, per the `dependencies` below) would overwrite their function code
      # with this stale jar, undoing the CloudFormation update that just pointed them at their own artifact.
      functionNames:
      - price-migration-engine-estimation-lambda-
      - price-migration-engine-amendment-lambda-
      - price-migration-engine-notification-lambda-
    dependencies: [cfn]
