version = 3.11.1
runner.dialect = scala213

maxColumn = 120

docstrings.wrap = no

rewrite.trailingCommas.style = keep

// cohortTableCreationLambda is the first lambda migrated to Scala 3 (core/coreScala3 share their source, so
// they keep the scala213 dialect above since they must stay parseable/formattable under both Scala versions).
fileOverride {
  "glob:**/cohortTableCreationLambda/**" {
    runner.dialect = scala3
  }
}
